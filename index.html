<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Moonlit Wishes - เทศกาลไหว้พระจันทร์กับเพื่อน</title>
    <link rel="stylesheet" href="style.css">
    <link href="https://fonts.googleapis.com/css2?family=Prompt:wght@300;400;600&display=swap" rel="stylesheet">
</head>
<body>
    <div class="night-sky">
        <div class="moon"></div>
        <div class="stars"></div>
        
        <!-- หน้าจอแรก: เข้าสู่ระบบ/สร้างห้อง -->
        <div id="login-screen" class="screen active">
            <div class="card">
                <h1>🥮 Moonlit Wishes</h1>
                <p>เทศกาลไหว้พระจันทร์ ชมจันทร์ ปล่อยโคม และพูดคุยกับเพื่อนๆ</p>
                <input type="text" id="username-input" placeholder="ใส่ชื่อของคุณ..." maxlength="15">
                <button onclick="joinGame()">เข้าสู่บรรยากาศงานวัด</button>
            </div>
        </div>

        <!-- หน้าจอหลักของเกม: ชมจันทร์และปล่อยโคม -->
        <div id="game-screen" class="screen">
            <header>
                <h2>🌕 คืนวันเพ็ญเดือน 8</h2>
                <div id="online-users">ออนไลน์: <span id="user-count">1</span> คน</div>
            </header>

            <div class="center-stage">
                <!-- พื้นที่แสดงโคมลอยที่ถูกปล่อยขึ้นฟ้า -->
                <div id="sky-lanterns"></div>
            </div>

            <div class="control-panel">
                <div class="wish-box">
                    <input type="text" id="wish-input" placeholder="เขียนคำอธิษฐานลงบนโคม..." maxlength="50">
                    <button onclick="releaseLantern()">🏮 ปล่อยโคมอธิษฐาน</button>
                </div>
                <div class="chat-box">
                    <div id="chat-messages"></div>
                    <div class="chat-input-area">
                        <input type="text" id="chat-input" placeholder="คุยกับเพื่อนๆ..." onkeypress="checkEnter(event)">
                        <button onclick="sendChatMessage()">ส่ง</button>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <script src="script.js"></script>
</body>
</html>
